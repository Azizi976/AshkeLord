plugins {
    id 'java'
    id 'application'
}

group = 'com.ashkelord'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.ashkelord.main.Launcher'
}

repositories {
    mavenCentral()
}

jar {
    manifest {
        attributes 'Main-Class': 'com.ashkelord.main.Launcher'
    }
}
